name: macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: ./menubar/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyTunnel-mac
          path: dist/ProxyTunnel-mac.dmg
          if-no-files-found: error
